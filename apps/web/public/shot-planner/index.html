<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Karevia · Storyboard</title>
    <link rel="stylesheet" href="./studio.css" />
  </head>
  <body>
    <header>
      <a href="/" aria-label="Karevia Studio">KAREVIA <span>/ STUDIO</span></a
      ><button id="language">English</button>
    </header>
    <main>
      <p class="eyebrow">STORY DESK &nbsp; / &nbsp; 01</p>
      <h1 id="heading"></h1>
      <p id="sub"></p>
      <div class="toolbar">
        <label
          ><span id="projectLabel"></span
          ><input id="name" maxlength="90" /></label
        ><label
          ><span id="typeLabel"></span
          ><select id="kind">
            <option value="film">Film</option>
            <option value="ad">UGC</option>
            <option value="music">Music</option>
          </select></label
        ><button id="template"></button>
      </div>
      <div id="shots"></div>
      <label
        ><input type="checkbox" id="rights" /><span id="rightsLabel"></span
      ></label>
      <label
        ><span id="aspectLabel"></span
        ><select id="aspect">
          <option>16:9</option>
          <option>9:16</option>
          <option>1:1</option>
        </select></label
      >
      <label
        ><span id="resolutionLabel"></span
        ><select id="resolution">
          <option value="standard">360p / 480×480</option>
          <option value="hd">720p / 720×720</option>
          <option value="fullhd">1080p / 1080×1080</option>
        </select></label
      >
      <label
        ><span id="framingLabel"></span
        ><select id="framing">
          <option value="fit">Fit / Sığdır</option>
          <option value="fill">Fill / Kırp</option>
        </select></label
      >
      <label
        ><span id="musicLabel"></span
        ><input id="music" maxlength="160" placeholder="music.wav"
      /></label>
      <label
        ><span id="musicVolumeLabel"></span
        ><input
          id="musicVolume"
          type="number"
          min="0"
          max="2"
          step="0.1"
          value="0.5"
      /></label>
      <label
        ><span id="musicStartLabel"></span
        ><input
          id="musicStart"
          type="number"
          min="0"
          max="3600"
          step="0.1"
          value="0"
      /></label>
      <label
        ><span id="musicDelayLabel"></span
        ><input
          id="musicDelay"
          type="number"
          min="0"
          max="180"
          step="0.1"
          value="0"
      /></label>
      <label
        ><span id="subtitlesLabel"></span
        ><input id="subtitles" maxlength="160" placeholder="captions.srt"
      /></label>
      <div class="actions">
        <button id="add"></button><button id="export"></button
        ><button id="timeline"></button
        ><label class="import"
          ><span id="importlabel"></span
          ><input type="file" id="load" accept=".json,application/json"
        /></label>
      </div>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="./studio.js"></script>
  </body>
</html>

# App Store screenshots (Maestro). Run by .github/workflows/screenshots.yml on
# an iOS simulator with a build made with EXPO_PUBLIC_SCREENSHOT_MODE=1.
#   maestro test -e OUT=tr -e HEADLINE="Yaz Esintisi EDP" -e PRICE="899 TL" \
#     -e BADGE="%30 indirim" apps/mobile/.maestro/screenshots.yaml
# Labels are regexes matching both Turkish and English, since the language
# follows the simulator locale. Numbers match docs/store/screenshots.md.
# The create screen is a full-screen editor: preview on top, panels open from
# the bottom tool bar (Şablon/Renk/Metin/Müzik/Format), "Videoyu oluştur" in
# the navigation bar, and the result ("Video hazır") covers the editor.
appId: com.berkdemirok.vidora
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Ürün videosu oluştur|Create a product video"
    timeout: 60000
- tapOn: "Ürün videosu oluştur|Create a product video"

# 2: sample product, cut-out shown in the live preview, Şablon panel open.
- extendedWaitUntil:
    visible: "Örnek ürünle dene|Try a sample product"
    timeout: 30000
- tapOn: "Örnek ürünle dene|Try a sample product"
- extendedWaitUntil:
    visible: "Videoyu oluştur|Create video"
    timeout: 120000
# Preview frames follow the cut-out.
- extendedWaitUntil:
    visible: "Video önizlemesi|Video preview"
    timeout: 300000
    optional: true
- extendedWaitUntil:
    notVisible: "Önizleme güncelleniyor|Updating preview"
    timeout: 120000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUT}/2

# Texts: the Metin panel scrolls on its own (max 300 pt), so swipe inside it.
# Fields are found by their unique placeholders.
- tapOn: "Metin|Text"
- extendedWaitUntil:
    visible: "Örn. Gül & Amber Parfüm|e.g. Rose & Amber Perfume"
    timeout: 10000
- tapOn: "Örn. Gül & Amber Parfüm|e.g. Rose & Amber Perfume"
- inputText: ${HEADLINE}
- pressKey: Enter
- repeat:
    times: 6
    while:
      notVisible: "Örn. 1.249 TL|e.g. \\$49"
    commands:
      - swipe:
          start: "50%, 86%"
          end: "50%, 74%"
          duration: 700
- tapOn: "Örn. 1.249 TL|e.g. \\$49"
- inputText: ${PRICE}
- pressKey: Enter
# The badge is nice to have; never let it block the screenshots.
- repeat:
    times: 4
    while:
      notVisible: "Örn. %30 indirim|e.g. 30% off"
    commands:
      - swipe:
          start: "50%, 86%"
          end: "50%, 74%"
          duration: 700
- tapOn:
    text: "Örn. %30 indirim|e.g. 30% off"
    optional: true
- runFlow:
    when:
      visible: "Örn. %30 indirim|e.g. 30% off"
    commands:
      - inputText: ${BADGE}
      - pressKey: Enter
- extendedWaitUntil:
    notVisible: "Önizleme güncelleniyor|Updating preview"
    timeout: 120000
    optional: true

# 1: Showcase (Vitrin), the default template for beauty.
- tapOn: "Videoyu oluştur|Create video"
- extendedWaitUntil:
    visible: "Video hazır|Video ready"
    timeout: 900000
# Let the result video play into the frame with headline and price.
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: ${OUT}/1

# 3: template choice, Campaign (Kampanya) under Advertisement.
- tapOn: "Düzenle|Edit"
# The last panel (Metin) is still open; open Şablon only if it is not, since
# tapping the open tab closes it.
- runFlow:
    when:
      notVisible: "Video türü: Reklam|Video type: Advertisement"
    commands:
      - tapOn: "Şablon|Template"
- tapOn: "Video türü: Reklam|Video type: Advertisement"
- tapOn: "Şablon: Kampanya.*|Template: Campaign.*"
- extendedWaitUntil:
    notVisible: "Önizleme güncelleniyor|Updating preview"
    timeout: 120000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUT}/3

# 4: Campaign result.
- tapOn: "Videoyu oluştur|Create video"
- extendedWaitUntil:
    visible: "Video hazır|Video ready"
    timeout: 900000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: ${OUT}/4

# 5: Turntable (Döner vitrin) under Product promotion.
- tapOn: "Düzenle|Edit"
- runFlow:
    when:
      notVisible: "Video türü: Ürün tanıtımı|Video type: Product promotion"
    commands:
      - tapOn: "Şablon|Template"
- tapOn: "Video türü: Ürün tanıtımı|Video type: Product promotion"
- tapOn: "Şablon: Döner vitrin.*|Template: Turntable.*"
- extendedWaitUntil:
    notVisible: "Önizleme güncelleniyor|Updating preview"
    timeout: 120000
    optional: true
- tapOn: "Videoyu oluştur|Create video"
- extendedWaitUntil:
    visible: "Video hazır|Video ready"
    timeout: 900000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: ${OUT}/5

# 6: Library with the three videos. The system back button is icon-only.
- tapOn:
    text: "Geri|Back"
    optional: true
- runFlow:
    when:
      visible: "Video hazır|Video ready"
    commands:
      - tapOn:
          point: "5%, 9%"
- extendedWaitUntil:
    visible: "Ürün videosu oluştur|Create a product video"
    timeout: 15000
    optional: true
- tapOn:
    text: "Kitaplık.*|Library.*"
    optional: true
- runFlow:
    when:
      notVisible: "Videolar|Videos"
    commands:
      - tapOn:
          point: "50%, 96%"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: ${OUT}/6

# 7: Settings, privacy paragraph.
- tapOn:
    text: "Ayarlar.*|Settings.*"
    optional: true
- runFlow:
    when:
      notVisible: "Genel|General"
    commands:
      - tapOn:
          point: "83%, 96%"
- scrollUntilVisible:
    element:
      text: ".*Ürün fotoğrafların.*|.*Your product photos.*"
    direction: DOWN
    speed: 20
    visibilityPercentage: 100
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: ${OUT}/7

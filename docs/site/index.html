<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vidora</title>
<meta name="description" content="Vidora – Ürün fotoğrafından reklam videosu / Product videos from one photo">
<style>
  :root { --bg: #faf7f2; --text: #2b2622; --muted: #6b625a; --line: #e6dfd5; --accent: #9a4a1f; --card: #fffdf9; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 64px 16px 48px; }
  h1 { font-size: 2.5rem; line-height: 1.1; margin: 0 0 12px; letter-spacing: -0.02em; }
  .tagline { font-size: 1.125rem; color: var(--muted); margin: 0 0 32px; }
  nav { display: flex; flex-wrap: wrap; gap: 12px; }
  nav a { display: inline-block; padding: 12px 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--accent); text-decoration: none; font-weight: 600; }
  nav a:hover, nav a:focus-visible { border-color: var(--accent); }
  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.875rem; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Vidora</h1>
  <p class="tagline">Ürün fotoğrafından reklam videosu / Product videos from one photo</p>
  <nav>
    <a href="privacy/">Gizlilik / Privacy</a>
    <a href="support/">Destek / Support</a>
  </nav>
  <footer>
    <a href="mailto:contact@example.com">contact@example.com</a>
  </footer>
</main>
</body>
</html>
